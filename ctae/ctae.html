<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CTAE Career Pathways</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body {
margin: 0;
font-family: 'Montserrat', Arial, Helvetica, sans-serif;
color: #fff;
overflow-x: hidden;
background: #3b0f1a;
}

/* Top black nav bar styles */
.top-navbar {
  width: 100vw;
  background: #111;
  height: 100px;
  display: flex;
  align-items: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  z-index: 100;
  position: relative;
}

.top-navbar-content {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
}

.top-navbar-logos {
  display: flex;
  align-items: center;
  gap: 24px;
  margin-left: 120px;
}

.top-navbar-logos .navbar-logo-img:first-child {
  height: 100px;
  width: auto;
}

.top-navbar-logos .navbar-logo-img:last-child {
  height: 80px;
  width: auto;
  margin-left: auto;
  margin-right: 180px;
}

.navbar-logo-img {
  height: 80px;
  width: auto;
  object-fit: contain;
  display: block;
}

.top-navbar-links {
  display: flex;
  gap: 18px;
}

.top-nav-btn {
  background: #222;
  color: #fff;
  border: none;
  border-radius: 7px;
  padding: 10px 32px;
  font-size: 1.1rem;
  font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
  font-weight: 600;
  text-decoration: none;
  transition: background 0.18s, color 0.18s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.10);
  letter-spacing: 1px;
  cursor: pointer;
  display: inline-block;
}

.top-nav-btn:hover {
  background: #fff;
  color: #111;
}

@media (max-width: 700px) {
  .top-navbar-content {
    padding: 0 8px;
  }
  .top-navbar-logos {
    margin-left: 10px;
    gap: 10px;
  }
  .top-navbar-logos .navbar-logo-img:first-child {
    height: 60px;
  }
  .top-navbar-logos .navbar-logo-img:last-child {
    height: 40px;
    margin-right: 20px;
  }
  .navbar-logo-img {
    height: 40px;
  }
  .top-navbar {
    height: 56px;
  }
}

/* Remove space between navbars */
.navbar {
  margin: 0;
  padding: 0;
  background-color: rgb(159, 49, 49);
}

.navbar ul {
  list-style: none;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 0;
  padding: 0;
}

.navbar a {
  color: white;
  text-decoration: none;
  padding: 20px 50px;
  font-size: 22.5px;
  font-family: Georgia, 'Times New Roman', Times, serif;
  display: block;
}

.navbar a:hover {
  background-color: rgb(129, 0, 0);
}

/* Shared shade for first and third division */
.shared-bg {
background: linear-gradient(135deg, #3b0f1a, #701f2b);
padding: 60px 20px;
}

/* Hero section */
#hero-section {
padding: 80px 20px;
text-align: center;
}

#typing-text {
display: inline-block;
font-size: 3rem;
white-space: nowrap;
overflow: hidden;
}

/* Buttons + timeline section */
#buttons-timeline-section {
padding: 60px 10%;
background: linear-gradient(180deg, #fdfdfd, #f5f5f5);
color: #222;
border-radius: 0 0 20px 20px;
box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

/* Section titles */
h2 {
text-align: center;
margin-bottom: 50px;
font-size: 2.2rem;
color: #222;
}

/* Pathway buttons */
.buttons {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 30px;
justify-items: center;
margin-bottom: 50px;
max-width: 1300px;
margin-left: auto;
margin-right: auto;
padding: 0 20px;
}

.buttons button {
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
width: 100%;
max-width: 380px;
height: 160px;
border-radius: 16px;
padding: 20px 15px;
font-family: 'Montserrat', sans-serif;
font-weight: 600;
cursor: pointer;
border: none;
background: linear-gradient(145deg, #7a1f2b, #b32c3a);
color: #fff;
text-align: center;
transition: all 0.3s ease;
text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
}

.button-main {
font-size: 1.35rem;
line-height: 1.4;
font-weight: 700;
}

.button-sub {
display: none;
}

.buttons button:hover {
background: linear-gradient(145deg, #b32c3a, #ff4757);
transform: scale(1.05);
}

/* Course Grid Layout */
#pathway-name {
text-align:center;
font-size: 28px;
margin-bottom:30px;
color:#222;
display:none;
font-family: 'Montserrat', sans-serif;
}

.courses-container {
display: none;
max-width: 1200px;
margin: 0 auto;
padding: 20px;
}

.courses-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
gap: 20px;
margin-bottom: 40px;
}

/* Course Card Styles */
.course-card {
background: linear-gradient(145deg, #fff, #f8f9fa);
border-radius: 16px;
padding: 25px;
box-shadow: 0 4px 15px rgba(0,0,0,0.1);
cursor: pointer;
transition: all 0.4s ease;
position: relative;
overflow: hidden;
border: 2px solid transparent;
}

.course-card:hover {
transform: translateY(-5px) scale(1.01);
box-shadow: 0 12px 35px rgba(0,0,0,0.15);
border-color: #7a1f2b;
}

.course-card.expanded {
grid-column: 1 / -1;
transform: scale(1);
box-shadow: 0 20px 50px rgba(0,0,0,0.2);
border-color: #b32c3a;
z-index: 10;
}

.course-title {
font-size: 1.3rem;
font-weight: bold;
color: #222;
margin-bottom: 15px;
font-family: 'Montserrat', sans-serif;
}

.course-card.expanded .course-title {
font-size: 1.5rem;
color: #7a1f2b;
border-bottom: 2px solid #7a1f2b;
padding-bottom: 10px;
margin-bottom: 20px;
}

.course-preview {
color: #666;
font-size: 0.95rem;
line-height: 1.4;
}

.course-description {
display: none;
color: #444;
font-size: 1rem;
line-height: 1.6;
margin-top: 15px;
padding-top: 15px;
border-top: 1px solid #eee;
animation: fadeInDesc 0.5s ease-in-out forwards;
}

.course-card.expanded .course-description {
display: block;
}

.course-card.expanded .course-preview {
display: none;
}

@keyframes fadeInDesc {
from { opacity: 0; transform: translateY(10px);}
to { opacity: 1; transform: translateY(0);}
}

/* Close button */
.close-btn {
display: none;
position: absolute;
top: 15px;
right: 15px;
background: #ff4757;
color: white;
border: none;
border-radius: 50%;
width: 30px;
height: 30px;
cursor: pointer;
font-size: 1.2rem;
}

.course-card.expanded .close-btn {
display: flex;
align-items: center;
justify-content: center;
}

.close-btn:hover {
background: #ff3742;
transform: scale(1.1);
}

/* Teachers Section / Carousel */
#teacher-section {
margin-top: 60px;
text-align: center;
}

.teacher-carousel {
position: relative;
width: 100%;
max-width: 600px;
margin: 0 auto;
overflow: hidden;
border-radius: 16px;
background: rgba(255,255,255,0.1);
padding: 40px 20px;
}

.teacher-slide {
display: none;
font-size: 1.2rem;
font-weight: 600;
color: #fff;
transition: opacity 0.5s ease;
}

.teacher-slide.active {
display: block;
opacity: 1;
}

/* Responsive */
@media (max-width: 768px) {
.courses-grid {
grid-template-columns: 1fr;
gap: 15px;
}

.course-card { 
padding: 20px; 
}

.course-title { 
font-size: 1.1rem; 
}

.course-card.expanded .course-title { 
font-size: 1.3rem; 
}

.course-preview, .course-description { 
font-size: 0.9rem; 
}

.teacher-slide { 
font-size: 1rem; 
}
}
</style>
</head>

<body>

<!-- Navigation -->
<nav class="top-navbar">
  <div class="top-navbar-content">
    <div class="top-navbar-logos">
      <img src="../img/LamertLogo.png" alt="Lambert Logo" class="navbar-logo-img">
      <img src="../img/Tsalogo-Photoroom.png" alt="TSA Logo" class="navbar-logo-img">
    </div>
    <div class="top-navbar-links">
      <a href="#about" class="top-nav-btn">About</a>
      <a href="../chapter/chapter.html" class="top-nav-btn">Chapter</a>
      <a href="../Chatbot/chatbot.html" class="top-nav-btn">Project</a>
    </div>
  </div>
</nav>
<nav class="navbar">
  <ul>
    <li><a href="../Chatbot/chatbot.html"><b>Contact</b></a></li>
    <li><a href="#skills"><b>Skills</b></a></li>
    <li><a href="#about"><b>About</b></a></li>
    <li><a href="index.html"><b>Home</b></a></li>
  </ul>
</nav>

<!-- Hero -->
<div id="hero-section" class="shared-bg">
<h1 id="typing-text"></h1>
</div>

<!-- Buttons + Timeline -->
<section id="buttons-timeline-section">
<h2>Career Pathways</h2>

<div class="buttons">
<button data-target="cs">
<span class="button-main">Computer Science Pathway</span>
<span class="button-sub">Click to Explore Courses</span>
</button>
<button data-target="bm">
<span class="button-main">Business & Management Pathway</span>
<span class="button-sub">Click to Explore Courses</span>
</button>
<button data-target="hc">
<span class="button-main">Health Care Pathway</span>
<span class="button-sub">Click to Explore Courses</span>
</button>
<button data-target="eng">
<span class="button-main">Engineering Pathway</span>
<span class="button-sub">Click to Explore Courses</span>
</button>
<button data-target="av">
<span class="button-main">AV Technology & Film Pathway</span>
<span class="button-sub">Click to Explore Courses</span>
</button>
<button data-target="mk">
<span class="button-main">Marketing Pathway</span>
<span class="button-sub">Click to Explore Courses</span>
</button>
</div>

<div id="pathway-name"></div>
<div class="courses-container" id="courses-container"></div>
</section>

<!-- Teacher Section -->
<div id="teacher-section" class="shared-bg">
<div id="teacher-carousel" class="teacher-carousel"></div>
</div>

<script>
// Hero typing effect
const heroText = "Career & Technical Education";
const typingElement = document.getElementById("typing-text");
let i = 0;
function typeHero() {
if(i < heroText.length){
typingElement.textContent += heroText.charAt(i);
i++;
setTimeout(typeHero, 80);
}
}
typeHero();

// Course definitions with longer 3-4 sentence descriptions
const courseDescriptions = {
"Introduction to Software and Technology": {
full:"This foundational CTAE course introduces students to a wide variety of digital technologies, including software, hardware, and emerging tools used in technology careers. Students learn programming basics, computational thinking, and problem-solving strategies. They gain hands-on experience with spreadsheets, word processing, and collaborative tools. By the end of the course, students are equipped with essential skills to pursue advanced computing and IT courses."
},
"AP Computer Science Principles": {
full:"AP Computer Science Principles introduces students to fundamental computing concepts, including algorithms, data, programming, and cybersecurity. Students explore how computing impacts society, business, and everyday life. Hands-on projects emphasize computational thinking, creativity, and collaboration. This course prepares students for future computer science studies and technology-driven careers."
},
"AP Computer Science A": {
full:"AP Computer Science A focuses on object-oriented programming in Java. Students design and implement complex programs while learning data structures, algorithms, and debugging strategies. The course emphasizes efficiency, problem solving, and code quality. Students gain a solid foundation for college-level CS and software development careers."
},
"Cloud Computing": {
full:"Cloud Computing introduces students to cloud architecture, service models, and deployment strategies. Students learn about storage solutions, virtualization, and collaborative tools. Practical exercises highlight security, scalability, and data management. This course prepares students for IT careers in modern cloud-based systems."
},
"Introduction to Business & Technology": {
full:"This course provides an overview of essential business concepts and technology applications in professional settings. Students learn workplace communication, teamwork, and project management skills. Hands-on exercises reinforce technology use in business operations. By the end, students are prepared for careers in management, entrepreneurship, and business technology."
},
"Financial Literacy": {
full:"Financial Literacy teaches students how to manage money effectively, including budgeting, saving, and responsible spending. Students explore credit, investments, and long-term financial planning. Real-world examples develop decision-making and problem-solving skills. This course equips students to handle personal finances and prepare for future economic challenges."
},
"Banking, Investments, and Insurance": {
full:"Students explore banking operations, investments, and insurance principles. They analyze financial products, manage risk, and make informed decisions. Case studies highlight real-world financial applications. This course prepares students for careers in banking, investments, and financial management."
},
"Principles of Accounting I": {
full:"Principles of Accounting I teaches students to maintain accurate financial records for businesses. Students prepare balance sheets, income statements, and ledgers while learning ethical accounting practices. Emphasis is placed on analysis and critical thinking. This course lays the groundwork for careers in accounting, auditing, and business management."
},
"Introduction to Health Care (IHC)": {
full:"Introduction to Health Care exposes students to a wide range of healthcare careers and foundational medical concepts. Students learn medical terminology, patient care, and safety protocols. The course emphasizes teamwork, professionalism, and healthcare ethics. Students are prepared for further study in allied health, biotechnology, or nursing pathways."
},
"Essentials to Biotechnology": {
full:"Essentials to Biotechnology introduces core biological concepts and laboratory techniques used in healthcare and biotech. Topics include cellular biology, genetics, molecular methods, and lab safety. Students conduct experiments, document results, and analyze data. This course provides a foundation for advanced biotechnology studies and lab-based careers."
},
"Essentials to Healthcare": {
full:"Essentials to Healthcare focuses on wellness, nutrition, anatomy, and physiology. Students explore preventive healthcare, patient care basics, and health literacy. Hands-on exercises reinforce practical knowledge and ethical considerations. The course prepares students for healthcare, fitness, and allied health pathways."
},
"Biotechnology": {
full:"Biotechnology deepens students' understanding of molecular biology, genetics, and laboratory techniques. Students perform experiments, analyze results, and solve real-world problems. Topics include DNA/RNA technologies, genetic engineering, and bioinformatics. This course prepares students for careers in research, clinical labs, and biotech industries."
},
"Phlebotomy": {
full:"Phlebotomy teaches safe blood collection and preparation for certification. Students learn anatomy, venipuncture, infection control, and patient communication. Hands-on practice develops clinical skills and attention to detail. Students are prepared for healthcare support roles and laboratory careers."
},
"Sports Medicine": {
full:"Sports Medicine focuses on injury prevention, assessment, and treatment in athletic settings. Students learn anatomy, therapeutic techniques, and rehabilitation strategies. Practical exercises simulate real-world sports care scenarios. The course prepares students for careers in physical therapy, athletic training, and sports healthcare."
},
"Foundations of Engineering": {
full:"Foundations of Engineering introduces engineering design, problem-solving, and technology applications. Students explore mechanics, materials, electronics, and CAD software. Hands-on projects emphasize creativity, collaboration, and critical thinking. This course prepares students for advanced STEM courses and engineering careers."
},
"Engineering Concepts": {
full:"Engineering Concepts builds on foundational knowledge through applied projects and problem solving. Students design, test, and refine solutions using engineering tools. Teamwork, project management, and iterative design are emphasized. The course prepares students for higher-level engineering studies and real-world STEM careers."
},
"Engineering Applications": {
full:"Engineering Applications allows students to apply principles to real-world challenges. Students work on interdisciplinary projects, analyze data, and optimize solutions. Innovation, sustainability, and professional practices are emphasized. The course prepares students for post-secondary education and careers in engineering and technology."
},
"AV Technology & Film I": {
full:"AV Technology & Film I introduces audio and video production, including camera operation, lighting, and sound recording. Students learn storytelling techniques and basic editing skills. Hands-on projects develop technical skills and creativity. The course prepares students for advanced media courses and digital media careers."
},
"AV Technology & Film II": {
full:"AV Technology & Film II expands media production skills with advanced editing, lighting, sound design, and special effects. Students work on collaborative projects simulating professional environments. Portfolio development and project management are emphasized. The course prepares students for media careers and higher education in film or digital media."
},
"AV Technology & Film III": {
full:"AV Technology & Film III emphasizes advanced media production, including cinematography, audio mastering, and professional project management. Students produce independent and group projects for portfolios. Creativity, technical expertise, and real-world application are highlighted. The course prepares students for post-secondary studies and media industry careers."
},
"Marketing Principles": {
full:"Marketing Principles introduces core concepts such as consumer behavior, market research, branding, and promotion. Students explore product development, advertising, and sales strategies. Hands-on examples demonstrate real-world marketing applications. The course provides foundational skills for marketing, business, and entrepreneurship careers."
},
"Marketing and Entrepreneurship": {
full:"Marketing and Entrepreneurship explores marketing strategies for new ventures. Students develop business plans, branding, and sales campaigns. Projects emphasize creativity, problem-solving, and practical application. The course prepares students for entrepreneurial careers and advanced business studies."
},
"Introduction to Sports & Entertainment Marketing": {
full:"This course focuses on marketing within sports, entertainment, and events industries. Students learn about sponsorships, promotions, fan engagement, and social media strategies. Hands-on projects simulate real-world marketing campaigns. The course prepares students for careers in sports marketing, entertainment, and event management."
},
"Marketing Management": {
full:"Marketing Management teaches students to plan, implement, and evaluate comprehensive marketing strategies. Students analyze market trends, create campaigns, and study consumer behavior. Leadership, strategy, and communication are emphasized. The course prepares students for professional marketing roles and advanced business studies."
},
"Advanced Sports & Entertainment Marketing": {
full:"Advanced Sports & Entertainment Marketing engages students in designing and executing large-scale marketing campaigns. Students analyze data, create brand strategies, and evaluate results. Creativity, collaboration, and strategic thinking are emphasized. The course prepares students for professional careers in sports, entertainment, and event marketing."
}
};

// Pathways
const pathways = {
cs:["Introduction to Software and Technology","AP Computer Science Principles","AP Computer Science A","Cloud Computing"],
bm:["Introduction to Business & Technology","Financial Literacy","Banking, Investments, and Insurance","Principles of Accounting I"],
hc:["Introduction to Health Care (IHC)","Essentials to Biotechnology","Essentials to Healthcare","Biotechnology","Phlebotomy","Sports Medicine"],
eng:["Foundations of Engineering","Engineering Concepts","Engineering Applications"],
av:["AV Technology & Film I","AV Technology & Film II","AV Technology & Film III"],
mk:["Marketing Principles","Marketing and Entrepreneurship","Introduction to Sports & Entertainment Marketing","Marketing Management","Advanced Sports & Entertainment Marketing"]
};

// Teachers
const pathwayTeachers = {
cs: ["Satheya Chandran", "Joseph Fuqua", "Stephanie Beaulieu", "Michael Roberts", "Waheetha Banu Yunus"],
bm: ["Stephanie Beaulieu", "Jason Ware", "Jason Earwood"],
hc: ["Josh Bush", "Tracy Floyd", "Cathy O'Haver", "Melinda Suber", "Catherine Sharer"],
eng: ["Josh Sullivan", "Anupam Goli"],
av: ["Ben Cook"],
mk: ["Deborah Hutchison", "Cassidy Mazzei", "Michael Roberts"]
};

const coursesContainer = document.getElementById('courses-container');
const teacherCarousel = document.getElementById('teacher-carousel');
const pathwayNameDisplay = document.getElementById('pathway-name');
let currentExpandedCard = null;
let carouselInterval;

document.querySelectorAll('.buttons button').forEach((btn)=>{
btn.addEventListener('click',()=>{
const id = btn.getAttribute('data-target');
const courses = pathways[id];
if(!courses) return;

// Reset expanded card
if(currentExpandedCard) currentExpandedCard.classList.remove('expanded');

pathwayNameDisplay.textContent = btn.querySelector('.button-main').textContent;
pathwayNameDisplay.style.display = "block";

// Teacher carousel
clearInterval(carouselInterval);
const teachers = pathwayTeachers[id] || [];
teacherCarousel.innerHTML = "";

if(teachers.length === 0) {
teacherCarousel.textContent = "No teachers assigned.";
} else if(teachers.length === 1){
const div = document.createElement('div');
div.classList.add('teacher-slide','active');
div.textContent = teachers[0];
teacherCarousel.appendChild(div);
} else {
teachers.forEach((t, index)=>{
const div = document.createElement('div');
div.classList.add('teacher-slide');
if(index === 0) div.classList.add('active');
div.textContent = t;
teacherCarousel.appendChild(div);
});

let slideIndex = 0;
const slides = teacherCarousel.querySelectorAll('.teacher-slide');
carouselInterval = setInterval(()=>{
slides[slideIndex].classList.remove('active');
slideIndex = (slideIndex +1) % slides.length;
slides[slideIndex].classList.add('active');
}, 2000);
}

// Courses
coursesContainer.style.display = "block";
coursesContainer.innerHTML = '<div class="courses-grid" id="courses-grid"></div>';
const coursesGrid = document.getElementById('courses-grid');

courses.forEach((course)=>{
const courseData = courseDescriptions[course] || {full:"Full course info not available yet."};

const card = document.createElement('div');
card.classList.add('course-card');
card.innerHTML = `
<button class="close-btn">&times;</button>
<div class="course-title">${course}</div>
<div class="course-preview">Click for more info</div>
<div class="course-description">${courseData.full}</div>
`;

const closeBtn = card.querySelector('.close-btn');
closeBtn.addEventListener('click', (e) => {
e.stopPropagation();
card.classList.remove('expanded');
currentExpandedCard = null;
});

card.addEventListener('click', () => {
if(currentExpandedCard && currentExpandedCard !== card) currentExpandedCard.classList.remove('expanded');
card.classList.toggle('expanded');
currentExpandedCard = card.classList.contains('expanded') ? card : null;
});

coursesGrid.appendChild(card);
});

});
});
</script>

</body>
</html>
